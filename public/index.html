<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>

<body>

  <main id="auth-container" class="auth-container">

    <!-- ===================== TELA 1: LOGIN (60/40) ===================== -->
    <section id="login-screen" class="screen login-screen active">

      <div class="panel panel-image" id="login-image-panel">
        <img src="img/login-cover.jpg" alt="" id="login-image" class="panel-img">
        <div class="panel-overlay">
          <h2 class="panel-label" id="login-label-text">Texto de apresentação (login)</h2>
        </div>
      </div>

      <div class="panel panel-form">
        <form id="loginForm" class="form" novalidate>
          <h1 class="form-title">Entrar</h1>

          <div class="field">
            <label for="loginEmail">E-mail</label>
            <input type="email" id="loginEmail" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="loginPassword">Senha</label>
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
          </div>

          <span id="loginError" class="error-message"></span>

          <button type="submit" id="btnLogin" class="btn btn-primary">Entrar</button>

          <p class="switch-text">
            Não tem uma conta?
            <button type="button" id="btnGoToSignup" class="btn-link">Cadastre-se</button>
          </p>
        </form>
      </div>

    </section>

    <!-- ===================== TELA 2: CADASTRO (50/50) ===================== -->
    <section id="signup-screen" class="screen signup-screen">

      <div class="panel panel-form">
        <form id="signupForm" class="form" novalidate>
          <h1 class="form-title">Criar conta</h1>

          <div class="field">
            <label for="signupName">Nome</label>
            <input type="text" id="signupName" name="name" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="signupEmail">E-mail</label>
            <input type="email" id="signupEmail" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="signupUsername">Nome de usuário</label>
            <input type="text" id="signupUsername" name="username" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="signupPassword">Senha</label>
            <input type="password" id="signupPassword" name="password" autocomplete="new-password" required>
          </div>

          <span id="signupError" class="error-message"></span>

          <button type="submit" id="btnSignup" class="btn btn-primary">Cadastrar</button>

          <p class="switch-text">
            Já tem uma conta?
            <button type="button" id="btnGoToLogin" class="btn-link">Entrar</button>
          </p>
        </form>
      </div>

      <div class="panel panel-image" id="signup-image-panel">
        <img src="img/signup-cover.jpg" alt="" id="signup-image" class="panel-img">
        <div class="panel-overlay">
          <h2 class="panel-label" id="signup-label-text">Texto de apresentação (cadastro)</h2>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
